# Render Blueprint — CreyvaPH LMS
# Deploy via: Dashboard → New → Blueprint → point to this repo, or
# render.yaml is auto-detected when you create a Blueprint from the repo.
#
# ENV SECRETS: DATABASE_URL and AUTH_SECRET use sync:false — after the first
# deploy, fill them in once under Dashboard → Environment. Everything else is
# applied automatically from this file.

services:
  - type: web
    name: creyvaph-lms
    runtime: node
    rootDir: .
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: APP_URL
        value: ${RENDER_EXTERNAL_URL}
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://kjpnyowsexasqofiejze.supabase.co
